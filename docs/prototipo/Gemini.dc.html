<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Lectio — Per Gemini</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2F3CB0;text-decoration:none}a:hover{color:#1F2A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F4F0; color: #1A1A1F; font-family: Figtree, system-ui, sans-serif">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 76px; overflow-y: auto; padding: 16px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 8px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.6px">Per Gemini</h1>

<div style="background: #FFFFFF; border-radius: 22px; padding: 18px; box-shadow: 0 1px 2px rgba(20,20,30,.04), 0 10px 28px rgba(20,20,30,.07); display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 30px; height: 30px; border-radius: 999px; background: #3D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">1</span><span style="font-size: 17px; font-weight: 800">Copia il testo</span></div>
<button onClick="{{ copia }}" style="{{ stileCopia }}">
<sc-if value="{{ copiato }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if>
<span>{{ etichettaCopia }}</span></button>
<sc-if value="{{ errore }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 600; color: #9B1C1C">Non sono riuscito a copiarlo: tieni premuto sul testo qui sotto.</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 30px; height: 30px; border-radius: 999px; background: #ECEEFE; color: #2F3CB0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">2</span><span style="font-size: 17px; font-weight: 800">Apri Gemini e manda la foto della verifica</span></div>
<a href="https://gemini.google.com/app" style="height: 50px; border-radius: 16px; background: #ECEEFE; color: #2F3CB0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Apri Gemini</a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 30px; height: 30px; border-radius: 999px; background: #ECEEFE; color: #2F3CB0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">3</span><span style="font-size: 17px; font-weight: 800">Condividi il file a Lectio</span></div>
<button style="height: 50px; border-radius: 16px; border: none; background: #ECEEFE; color: #2F3CB0; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Scegli il file</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #5E5E68">IL TESTO</span>
<div style="background: #FFFFFF; border-radius: 22px; padding: 18px; box-shadow: 0 1px 2px rgba(20,20,30,.04); font-size: 15px; line-height: 1.55; white-space: pre-wrap; user-select: text">{{ testo }}</div>
</div>
</div>

<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #ECEBE6; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 8px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5E5E68; font-size: 12px; font-weight: 600">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Oggi</a>
<a href="Materie.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5E5E68; font-size: 12px; font-weight: 600">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M8 7h6"></path></svg></span>Materie</a>
<a href="Lettore.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5E5E68; font-size: 12px; font-weight: 600">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5E68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="5" height="7" rx="2"></rect><rect x="16" y="14" width="5" height="7" rx="2"></rect></svg></span>Lezioni</a>
<a href="Gemini.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #2F3CB0; font-size: 12px; font-weight: 700">
<span style="width: 56px; height: 30px; border-radius: 999px; background: #ECEEFE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F3CB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"></path></svg></span>Per Gemini</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const testo = 'Trascrivi questa verifica in un file di testo, senza inventare niente. Usa sempre questo schema:\nMATERIA: … | PROF: … | DATA: … | TIPO: scritta/orale | VOTO: …\nPer ogni domanda:\n## Domanda N (punti: …)\nTESTO: la domanda parola per parola\nMIA RISPOSTA: quello che ho scritto io\nCORREZIONI DEL PROF: tutto quello che ha segnato o scritto, anche a penna o a margine, indicando a quale punto si riferisce\nPUNTI PRESI: …\nAlla fine: COMMENTO DEL PROF: …\nSe una parte non si legge scrivi [illeggibile], non indovinare.';
const pieno = 'height: 58px; border-radius: 18px; border: none; font-family: inherit; font-size: 17px; font-weight: 700; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; ';
return {
testo: testo,
copiato: !!s.copiato,
errore: !!s.errore,
etichettaCopia: s.copiato ? 'Copiato' : 'Copia il testo per Gemini',
stileCopia: pieno + (s.copiato ? 'background: #2B8A3E; box-shadow: 0 8px 20px rgba(43,138,62,.28);' : 'background: #3D4ED8; box-shadow: 0 8px 20px rgba(61,78,216,.28);'),
copia: () => {
const fatto = () => { this.setState({ copiato: true, errore: false }); setTimeout(() => this.setState({ copiato: false }), 2000); };
try {
if (navigator.clipboard && navigator.clipboard.writeText) {
navigator.clipboard.writeText(testo).then(fatto, () => this.setState({ errore: true }));
} else { this.setState({ errore: true }); }
} catch (e) { this.setState({ errore: true }); }
}
};
}
}
</script>
</body>
</html>
